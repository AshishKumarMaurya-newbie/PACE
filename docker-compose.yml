services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pace}
      POSTGRES_USER: ${POSTGRES_USER:-pace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - pace-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pace} -d ${POSTGRES_DB:-pace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pace-postgres:
